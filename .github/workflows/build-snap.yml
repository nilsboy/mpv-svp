name: build-snap

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-snap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pack mpv-svp snap
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      # Lets the release job publish even when the smoke test fails.
      pack: ${{ steps.pack.conclusion }}
    steps:
      - uses: actions/checkout@v7

      - name: Install snapcraft and LXD
        run: |
          sudo snap install snapcraft --classic
          sudo snap install lxd
          sudo lxd waitready --timeout=60
          sudo lxd init --auto
          # GitHub runners ship Docker, which sets the iptables FORWARD
          # policy to DROP; the LXD bridge forwards through that chain, so
          # the build instance boots with no outbound network and pack
          # dies with "A network related operation failed in a context of
          # no network access". Re-allow forwarding, and drop the
          # non-routable IPv6 the runner hands the instance (same
          # symptom). Both must run after `lxd init --auto`, which creates
          # lxdbr0.
          sudo iptables -P FORWARD ACCEPT
          sudo lxc network set lxdbr0 ipv6.address none

      - name: Stamp the snap version
        run: |
          # Tag pushes: derive the version from the tag (v1.2.3 -> 1.2.3) so the
          # packed snap matches its release. Everything else (main pushes, PRs,
          # manual dispatch): a dev version per the repo's versioning rules.
          case "$GITHUB_REF_TYPE:$GITHUB_REF_NAME" in
            tag:*) ver="${GITHUB_REF_NAME#v}" ;;
            *)     ver="1.0.0-dev.${GITHUB_RUN_NUMBER}" ;;
          esac
          sed -i "s/^version:.*/version: \"$ver\"/" snap/snapcraft.yaml
          echo "snap version: $ver"

      - name: Pack the snap
        id: pack
        run: sudo snapcraft pack

      - name: Smoke-test the snap (headless SVP interpolation)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          sudo snap install --dangerous ./*.snap
          snap list mpv-svp

          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i testsrc2=duration=1:size=256x256:rate=24 \
            -pix_fmt yuv420p -an svp-in.mkv

          # Encode the clip through the snap's SVP pipeline: the interpolation
          # must raise the frame rate from 24 to ~60 fps; without it, output
          # stays at 24.
          mpv-svp.mpv --profile=svp --video-sync=audio \
            --o=svp-out.mkv --of=matroska --ovc=ffv1 \
            --log-file=svp-mpv.log \
            svp-in.mkv

          # ~1 s of input at 24 fps must produce ~1 s of output at 60 fps.
          frames="$(ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=nb_read_frames \
            -of default=noprint_wrappers=1:nokey=1 svp-out.mkv)"
          rate="$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=avg_frame_rate -of csv=p=0 svp-out.mkv)"
          echo "output: ${frames} frames @ ${rate} fps"
          awk -v frames="$frames" -v rate="$rate" 'BEGIN {
            if (frames < 55 || frames > 65) { print "FAIL: wrong frame count"; exit 1 }
            split(rate, a, "/")
            fps = a[1] / a[2]
            if (fps < 55 || fps > 65) { print "FAIL: wrong fps"; exit 1 }
            printf "PASS: interpolation raised 24 fps to %.2f fps\n", fps
          }'

      - name: Probe the snapd environment (on failure)
        if: failure()
        run: |
          # Dump the state that mpv sees under real snapd confinement, so a
          # failing smoke test is diagnosable from the step log alone.
          set +e
          echo "== snap env"
          snap run --shell mpv-svp.mpv -c 'echo SNAP=$SNAP; echo PYTHONPATH=$PYTHONPATH; echo LD_LIBRARY_PATH=$LD_LIBRARY_PATH; echo XDG_CONFIG_HOME=$XDG_CONFIG_HOME; echo VSSCRIPT_PATH=$VSSCRIPT_PATH'
          echo "== config dir"
          snap run --shell mpv-svp.mpv -c 'ls -la "$XDG_CONFIG_HOME/vapoursynth/" 2>&1; cat "$XDG_CONFIG_HOME/vapoursynth/vapoursynth.toml" 2>&1'
          echo "== python inside snap"
          snap run --shell mpv-svp.mpv -c 'python3.14 -c "import vapoursynth; print(vapoursynth.__version__)" 2>&1; python3.14 -m vapoursynth config 2>&1; echo regenerated; cat "$XDG_CONFIG_HOME/vapoursynth/vapoursynth.toml" 2>&1'
          echo "== vsscript load"
          snap run --shell mpv-svp.mpv -c 'MPV_VERBOSE=3 timeout 30 mpv --config-dir="$SNAP/mpv" --profile=svp --vo=null --frames=1 "av://lavfi:testsrc2=duration=1:size=192x192:rate=24,format=yuv420p" 2>&1 | tail -30'

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-diagnostics
          path: |
            svp-mpv.log
            svp-in.mkv
            svp-out.mkv
          if-no-files-found: ignore

      - name: Upload snap artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mpv-svp-snap
          path: ./*.snap
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    needs: build
    # Publish whenever the snap itself packed, so debug builds reach the
    # release page even while the smoke test is still failing.
    if: >-
      github.event_name == 'push'
      && always()
      && needs.build.outputs.pack == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: mpv-svp-snap
          path: release-files/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          # v* tag pushes: an exact release with generated notes.
          # main pushes: refresh the rolling "latest" pointer and archive each
          # build as its own snapshot release, so old snapshots stay available.
          if [ "$REF_TYPE" = "tag" ]; then
            gh release create "$REF" release-files/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$REF" \
              --generate-notes \
            || gh release upload "$REF" release-files/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release delete latest --yes \
              --repo "${GITHUB_REPOSITORY}" \
              --cleanup-tag || true
            gh release create latest release-files/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "$SHA" \
              --title "Latest snapshot (automated)" \
              --prerelease \
              --notes "Automated snapshot of ${GITHUB_REPOSITORY}@${SHA}, built by build-snap.yml (run ${GITHUB_RUN_ID}). Replaced on every push; old snapshots stay as snapshot-r<N> releases."

            archive="snapshot-r${GITHUB_RUN_NUMBER}"
            gh release create "$archive" release-files/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "$SHA" \
              --title "Snapshot 1.0.0-dev.${GITHUB_RUN_NUMBER}" \
              --prerelease \
              --notes "Archived snapshot of ${GITHUB_REPOSITORY}@${SHA} (run ${GITHUB_RUN_ID}), the snap packaged as 1.0.0-dev.${GITHUB_RUN_NUMBER}." \
            || gh release upload "$archive" release-files/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          fi
