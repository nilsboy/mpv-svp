# mpv configuration for SVP frame interpolation.

# A profile that turns on SVP through the bundled VapourSynth script.
# Usage: mpv --config-dir=mpv --profile=svp video.mkv
[svp]
vf-add=@svp:vapoursynth=~~/../vapoursynth/svp.vpy
# SVP renders from system memory, so only "copy-back" hardware decoding works.
# Offloading decode frees CPU for SVP's (CPU-only) motion search.
hwdec=auto-copy
hwdec-codecs=all
# SVP raises the frame rate; let the display sync resample to it.
video-sync=display-resample

# Load the runtime toggle script (Ctrl+s enables/disables SVP mid-playback).
scripts-append=~~/scripts/svp-toggle.lua
